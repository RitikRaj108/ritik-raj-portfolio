<svg xmlns="http://www.w3.org/2000/svg" width="460" height="560" viewBox="0 0 460 560">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="overlayGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="spotLight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#3a3a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="460" height="560" fill="url(#bgGrad)"/>
  <rect width="460" height="560" fill="url(#spotLight)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#333" stroke-width="0.5" opacity="0.3"/>
  </pattern>
  <rect width="460" height="560" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Portrait silhouette placeholder -->
  <g transform="translate(230, 280)">
    <!-- Head -->
    <ellipse cx="0" cy="-100" rx="70" ry="85" fill="#333"/>
    
    <!-- Shoulders -->
    <ellipse cx="0" cy="60" rx="120" ry="80" fill="#333"/>
    
    <!-- Neck -->
    <rect x="-25" y="-30" width="50" height="80" fill="#333"/>
  </g>
  
  <!-- Add your photo text -->
  <text x="230" y="480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#666" letter-spacing="0.1em">
    ADD YOUR PHOTO
  </text>
  <text x="230" y="505" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#555">
    /public/hero-portrait.jpg
  </text>
  
  <!-- Bottom gradient overlay -->
  <rect width="460" height="560" fill="url(#overlayGrad)"/>
</svg>